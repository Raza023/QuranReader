<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Quran Majeed</title>
	<meta name="description"
		content="A simple Quran Majeed with Surah and Verse selection, audio playback, and translations." />
	<meta name="keywords"
		content="Quran, Quran Majeed, Surah, Verse, Audio, Translation, Urdu, Arabic, Indopak Nastaleeq" />
	<meta name="author" content="Your Name" />
	<meta name="theme-color" content="#3b82f6" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="msapplication-TileColor" content="#3b82f6" />
	<meta name="msapplication-TileImage" content="src/favicon.png" />
	<meta name="application-name" content="Quran Majeed" />
	<meta name="apple-mobile-web-app-title" content="Quran Majeed" />
	<!-- Favicon -->
	<link rel="icon" type="image/png" href="src/favicon.png">
	<style>
		@font-face {
			font-family: 'indopak-nastaleeq';
			src: url('src/fonts/indopak-nastaleeq/font.woff2') format('woff2'),
				url('src/fonts/indopak-nastaleeq/font.woff') format('woff'),
				url('src/fonts/indopak-nastaleeq/font.ttf') format('truetype');
			font-display: swap;
		}

		:root {
			/* === Light mode sepia theme === */
			--bg-light: #f4ecd8;
			--text-light: #3b2f2f;
			--card-bg-light: #fdf8ef;
			/* Dark mode unchanged */
			--bg-dark: #0f172a;
			--text-dark: #f9fafb;
			--card-bg-dark: #1e293b;
			/* Accent colors */
			--accent: #3b82f6;
			--accent-hover: #2563eb;
			/* Light mode brown replacements */
			--accent-light: #cd853f;
			/* brown */
			--accent-light-hover: #8d4312;
			--arabic-font: 'indopak-nastaleeq';
			--shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
			--radius: 16px;
		}

		body {
			margin: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-color: var(--bg-light);
			color: var(--text-light);
			transition: background-color 0.3s, color 0.3s;
			line-height: 1.6;
			overflow-x: hidden;
		}

		body.dark {
			background-color: var(--bg-dark);
			color: var(--text-dark);
		}

		/* Loading screen */
		#loading-screen {
			position: fixed;
			inset: 0;
			background: var(--bg-light);
			color: var(--text-light);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-size: 1.2rem;
			z-index: 2000;
			transition: opacity 0.5s ease;
		}

		body.dark #loading-screen {
			background: var(--bg-dark);
			color: var(--text-dark);
		}

		.spinner {
			width: 48px;
			height: 48px;
			border: 4px solid rgba(59, 130, 246, 0.3);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-bottom: 1rem;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		header {
			background: linear-gradient(135deg, var(--accent-light), var(--accent-light-hover));
			color: white;
			padding: 0.8rem 1rem;
			display: flex;
			flex-direction: column;
			align-items: stretch;
			box-shadow: var(--shadow);
			position: sticky;
			top: 0;
			z-index: 1000;
			gap: 0.5rem;
			border-bottom-left-radius: var(--radius);
			border-bottom-right-radius: var(--radius);
			overflow: hidden;
		}

		body.dark header {
			background: linear-gradient(135deg, var(--accent), var(--accent-hover));
		}

		@media (min-width: 600px) {
			header {
				flex-direction: row;
				justify-content: space-between;
				align-items: center;
				padding: 1rem 2rem;
			}
		}

		.header-title {
			font-weight: bold;
			font-size: 1.5rem;
			letter-spacing: 0.5px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.5rem;
			overflow: hidden;
		}

		.bismillah {
			font-family: var(--arabic-font);
			font-size: 2rem;
			text-align: center;
			margin: 0.5rem auto;
			opacity: 0;
			animation: fadeIn 0.8s ease forwards;
		}

		@keyframes fadeIn {
			to {
				opacity: 1;
			}
		}

		.buttons {
			display: flex;
			gap: 0.6rem;
			flex-wrap: wrap;
			align-items: center;
			justify-content: flex-end;
			/* overflow: hidden; */
		}

		/* Dropdowns - uniform look */
		select {
			padding: 8px 14px;
			border-radius: 12px;
			border: none;
			font-size: 1rem;
			background: linear-gradient(135deg, #fff9f0, #f0e6d2);
			box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
			transition: all 0.2s ease;
			cursor: pointer;
			font-weight: 500;
			color: #3b2f2f;
		}

		/* Light mode: brown menus */
		body:not(.dark) select {
			background: linear-gradient(135deg, #deb887, #cd853f);
			/* brown gradient */
			color: #2b1a12;
		}

		/* Dark mode dropdowns: black with white text */
		body.dark select {
			background: #000;
			color: #fff;
		}

		/* Force options inside dropdown */
		body.dark select option {
			background: #000;
			color: #fff;
		}

		body:not(.dark) select option {
			background: #deb887;
			color: #2b1a12;
		}

		select:hover {
			transform: translateY(-1px);
		}

		select:focus {
			outline: none;
			box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.4);
			/* brown glow */
		}

		body.dark select:focus {
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
			/* blue glow */
		}

		button.text-resize,
		.toggle-theme,
		.toggle-view {
			cursor: pointer;
			font-weight: bold;
			border: none;
			background: var(--accent-light);
			color: white;
			font-size: 1.1rem;
			border-radius: 10px;
			padding: 6px 12px;
			transition: all 0.2s;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
		}

		button.text-resize:hover,
		.toggle-theme:hover,
		.toggle-view:hover {
			background: var(--accent-light-hover);
			transform: scale(1.05);
		}

		body.dark button.text-resize,
		body.dark .toggle-theme,
		body.dark .toggle-view {
			background: var(--accent);
		}

		body.dark button.text-resize:hover,
		body.dark .toggle-theme:hover,
		body.dark .toggle-view:hover {
			background: var(--accent-hover);
		}

		.container {
			display: flex;
			flex-direction: column;
			padding: 1rem;
			max-width: 1300px;
			margin: 0 auto;
			gap: 1.5rem;
			opacity: 0;
			animation: fadeIn 0.6s ease 0.4s forwards;
		}

		@media (min-width: 768px) {
			.container {
				flex-direction: row;
			}

			.surah-list {
				flex: 1;
				max-width: 320px;
			}

			.surah-content {
				flex: 3;
			}
		}

		.surah-list {
			background: var(--card-bg-light);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			padding: 1rem;
		}

		body.dark .surah-list {
			background: var(--card-bg-dark);
		}

		.surah-item {
			padding: 0.8rem;
			border: 1px solid #ddd;
			border-radius: 10px;
			background-color: var(--card-bg-light);
			margin-bottom: 0.6rem;
			cursor: pointer;
			transition: all 0.2s ease;
			font-size: 1rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		body.dark .surah-item {
			background-color: var(--card-bg-dark);
			border-color: #333;
		}

		.surah-item:hover {
			background-color: #f7eedc;
			box-shadow: 0 4px 16px rgba(59, 130, 246, 0.12);
			transform: translateY(-2px);
		}

		.verse {
			margin: 1rem 0;
			text-align: right;
			direction: rtl;
			background: var(--card-bg-light);
			padding: 1rem;
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			transition: background 0.3s;
		}

		body.dark .verse {
			background: var(--card-bg-dark);
		}

		.translation {
			font-size: 1rem;
			color: #5a4630;
			text-align: right;
			direction: rtl;
			margin-top: 0.5rem;
			font-family: 'Noto Nastaliq Urdu', serif;
		}

		body.dark .translation {
			color: #ccc;
		}

		.hashiyah {
			font-size: 0.95rem;
			color: #1d7b02;
			text-align: right;
			direction: rtl;
			margin-top: 0.4rem;
		}

		body.dark .hashiyah {
			color: #3fe411;
		}

		.wbw {
			margin-top: 0.5rem;
			display: flex;
			flex-wrap: wrap;
			gap: 5px;
			justify-content: flex-start;
			direction: rtl;
		}

		.wbw span {
			background: #fdc289;
			padding: 3px 6px;
			border-radius: 6px;
			text-align: center;
		}

		body.dark .wbw span {
			background: rgba(59, 130, 246, 0.2);
		}

		::-webkit-scrollbar {
			width: 8px;
		}

		::-webkit-scrollbar-thumb {
			background: var(--accent);
			border-radius: 8px;
		}

		/* Fancy audio styling */
		audio {
			height: 25px;
			border-radius: 12px;
			box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
			transition: all 0.3s ease;
			background: #fdf8ef;
		}

		/* Light mode: brown audio player */
		body:not(.dark) audio::-webkit-media-controls-panel {
			background: linear-gradient(135deg, var(--accent-light), var(--accent-light-hover));
			color: white;
		}

		body.dark audio {
			background: #1e293b;
		}

		body.dark audio::-webkit-media-controls-panel {
			background: linear-gradient(135deg, var(--accent), var(--accent-hover));
			color: white;
		}

		audio:hover {
			box-shadow: 0 5px 16px rgba(0, 0, 0, 0.35);
			transform: translateY(-1px);
		}

		audio::-webkit-media-controls-play-button,
		audio::-webkit-media-controls-mute-button {
			filter: brightness(1.2);
		}

		.crossed {
			position: relative;
			display: inline-block;
		}

		.crossed::after {
			content: "";
			position: absolute;
			top: 50%;
			left: 0;
			width: 100%;
			height: 2px;
			background: red;
			transform: rotate(-45deg);
			transform-origin: center;
		}

		/* Tooltip styling for header buttons */
		button[data-tooltip] {
			position: relative;
		}

		button[data-tooltip]::after {
			content: attr(data-tooltip);
			position: absolute;
			bottom: -35px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(0, 0, 0, 0.8);
			color: #fff;
			font-size: 0.8rem;
			padding: 4px 8px;
			border-radius: 6px;
			white-space: nowrap;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.2s ease;
		}

		button[data-tooltip]:hover::after {
			opacity: 1;
		}

		@media (max-width: 767px) {
			.surah-list {
				display: none !important;
			}

			.header-title {
				width: 100%;
				justify-content: space-between;
			}

			.buttons {
				width: 100%;
				justify-content: flex-end;
				overflow-x: auto;
				-ms-overflow-style: none;
				scrollbar-width: none;
			}

			.buttons::-webkit-scrollbar {
				display: none;
			}
		}

		@media (max-width: 480px) {
			.header-title {
				font-size: 1.1rem;
			}

			.bismillah {
				font-size: 1.3rem;
			}

			.buttons select,
			.buttons button,
			.header-title select {
				font-size: 0.9rem;
				padding: 4px 8px;
			}
		}

		.verse-number {
			position: absolute;
			top: 0;
			left: 0;
			background: rgba(0, 0, 0, 0);
			color: white;
			padding: 6px 6px;
			border-radius: 4px;
			font-size: 0.8rem;
			font-weight: bold;
			z-index: 10;
			margin-left: 4px;
		}

		/* Custom dropdown styling */
		.surah-dropdown {
			position: relative;
			display: inline-block;
			margin-right: 0.6rem;
			z-index: 1001;
			/* Ensure it's above other elements */
		}

		#surahSearch {
			padding: 8px 14px;
			border-radius: 12px;
			border: none;
			font-size: 1rem;
			background: linear-gradient(135deg, #fff9f0, #f0e6d2);
			box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
			transition: all 0.2s ease;
			cursor: pointer;
			font-weight: 500;
			color: #3b2f2f;
			width: 250px;
			outline: none;
		}

		/* Light mode: brown input */
		body:not(.dark) #surahSearch {
			background: linear-gradient(135deg, #deb887, #cd853f);
			color: #2b1a12;
		}

		/* Dark mode: black input with white text */
		body.dark #surahSearch {
			background: #000;
			color: #fff;
		}

		/* Light mode placeholder */
		body:not(.dark) #surahSearch::placeholder {
			color: #2b1a12;
		}

		/* Dark mode placeholder */
		body.dark #surahSearch::placeholder {
			color: #fff;
		}


		#surahSearch:focus {
			outline: none;
			box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.4);
		}

		body.dark #surahSearch:focus {
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
		}

		.dropdown-content {
			display: none;
			position: absolute;
			background-color: #fff9f0;
			min-width: 180px;
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
			z-index: 1002;
			/* Higher than the header */
			border-radius: 12px;
			overflow: hidden;
			max-height: 300px;
			overflow-y: auto;
			margin-top: 4px;
			left: 0;
			top: 100%;
			/* Position below the input */
		}

		/* Light mode: brown dropdown items */
		body:not(.dark) .dropdown-content {
			background: linear-gradient(135deg, #deb887, #cd853f);
			color: #2b1a12;
		}

		/* Dark mode: black dropdown items with white text */
		body.dark .dropdown-content {
			background: #000;
			color: #fff;
		}

		.dropdown-content div {
			padding: 8px 14px;
			cursor: pointer;
			transition: background-color 0.2s;
		}

		.dropdown-content div:hover {
			background-color: rgba(0, 0, 0, 0.1);
		}

		/* Light mode: hover effect for brown */
		body:not(.dark) .dropdown-content div:hover {
			background-color: rgba(139, 69, 19, 0.2);
		}

		/* Dark mode: hover effect for dark */
		body.dark .dropdown-content div:hover {
			background-color: rgba(255, 255, 255, 0.1);
		}

		/* Scrollbar for dropdown */
		.dropdown-content::-webkit-scrollbar {
			width: 6px;
		}

		.dropdown-content::-webkit-scrollbar-thumb {
			background: var(--accent);
			border-radius: 6px;
		}

		/* Remove overflow: hidden from header and buttons */
		header,
		.buttons {
			overflow: visible !important;
		}
	</style>
</head>

<body class="dark">
	<div class="bismillah" id="loading-screen">
		<div class="spinner"></div>
		بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِیْمِ
	</div>
	<header>
		<div class="header-title">Quran Majeed
			<select style="float: right;" id="repeatSelect" aria-label="Repeat Count">
				<option value="1" selected>Repeat 1x</option>
				<option value="2">Repeat 2x</option>
				<option value="3">Repeat 3x</option>
				<option value="5">Repeat 5x</option>
				<option value="10">Repeat 10x</option>
				<option value="15">Repeat 15x</option>
			</select>
		</div>
		<div class="buttons">
			<!-- New dropdown with search box inside -->
			<div class="dropdown surah-dropdown">
				<input type="text" id="surahSearch" placeholder="Search Surah..." />
				<div id="dropdownList" class="dropdown-content"></div>
			</div>
			<!-- Keep original hidden select -->
			<select id="surahSelect" aria-label="Select Surah/Juzz" style="display:none;"></select>
			<select id="verseSelect" aria-label="Select Verse"></select>
			<button class="text-resize" onclick="changeFontSize(1)" aria-label="Increase Font Size"
				data-tooltip="Increase text">A+</button>
			<button class="text-resize" onclick="changeFontSize(-1)" aria-label="Decrease Font Size"
				data-tooltip="Decrease text">A-</button>
			<button class="toggle-theme" onclick="toggleTheme()" aria-label="Toggle Theme"
				data-tooltip="Light / Dark mode">🌓</button>
			<button class="toggle-view" onclick="toggleViewMode()" aria-label="Toggle View Mode"
				data-tooltip="Switch between Surah/Juzz view">📖</button>
			<button id="repeatSurahBtn" class="toggle-theme" aria-label="Repeat Surah Mode"
				data-tooltip="Repeat Mode"></button>
		</div>
	</header>
	<br>
	<div class="bismillah" id="bismillahText">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِیْمِ</div>
	<br>
	<div class="container">
		<div class="surah-list" id="surahList">Loading...</div>
		<div class="surah-content" id="surahContent">Select a Surah or Juzz to view</div>
	</div>
	<script src="src/script/surahmeta.js"></script>
	<script src="src/script/indopak.js"></script>
	<script src="src/script/tarjumah.js"></script>
	<script src="src/script/wbw-urdu.js"></script>
	<script src="src/script/juzzmeta.js"></script>
	<script>
		let arabicFontSize = 1.4, urduFontSize = 1.0, wbwArabicFontSize = 1.2, wbwUrduFontSize = 0.9, hashiyahFontSize = 0.95;
		const arabicFont = "'indopak-nastaleeq'";
		const surahList = document.getElementById('surahList');
		const surahContent = document.getElementById('surahContent');
		const surahSelect = document.getElementById('surahSelect');
		const verseSelect = document.getElementById('verseSelect');
		const bismillahText = document.getElementById('bismillahText');
		// === NEW Repeat Surah/Nothing/Next modes ===
		const repeatSurahBtn = document.getElementById("repeatSurahBtn");
		const surahModes = [
			{ html: "🔂", value: "surah" },  // repeat same surah
			{ html: "🔁", value: "next" },   // continue to next surah
			{ html: "<span class='crossed'>🔁</span>", value: "off" } // nothing
		];
		let playedIntroForSurahs = {};
		let currentSurahMode = 2; // default = off
		let currentPlayingAudio = null;
		// Pagination variables
		let currentSurah = null;
		let currentJuzz = null;
		let currentPage = 1;
		const ayatPerPage = 10;
		let currentAyatList = [];
		// View mode state
		let currentViewMode = 'surah'; // 'surah' or 'juzz'
		// === NEW: track mode of sequential playback ===
		let playbackMode = "arabic"; // or "urdu"
		// === NEW repeat count variables ===
		let repeatCount = 1; // default
		let repeatProgress = {}; // tracks {surah: {ayah: currentRepeat}}
		// Listen repeat selector
		document.addEventListener("DOMContentLoaded", () => {
			document.getElementById("repeatSelect").addEventListener("change", e => {
				repeatCount = parseInt(e.target.value) || 1;
				repeatProgress = {}; // reset
			});
		});
		function toggleTheme() {
			document.body.classList.toggle('dark');
		}
		function toggleViewMode() {
			playedIntroForSurahs = {}; // Reset tracking when switching view mode
			if (currentViewMode === 'surah') {
				currentViewMode = 'juzz';
				document.querySelector('.toggle-view').textContent = '📚';
				loadJuzzList();
				// Check for saved juzz state
				const lastJuzz = JSON.parse(localStorage.getItem("lastReadJuzz"));
				if (lastJuzz) {
					loadJuzz(lastJuzz.juzz);
				}
			} else {
				currentViewMode = 'surah';
				document.querySelector('.toggle-view').textContent = '📖';
				loadSurahList();
				// Restore last surah view state if available
				const last = JSON.parse(localStorage.getItem("lastRead"));
				if (last) {
					loadSurah(last.surah, last.verse);
				}
			}
		}
		function changeFontSize(delta) {
			arabicFontSize += 0.1 * delta;
			urduFontSize += 0.1 * delta;
			wbwArabicFontSize += 0.1 * delta;
			wbwUrduFontSize += 0.1 * delta;
			hashiyahFontSize += 0.1 * delta;
			document.querySelectorAll('.verse .arabic-text').forEach(el => el.style.fontSize = arabicFontSize + 'rem');
			document.querySelectorAll('.translation').forEach(el => el.style.fontSize = urduFontSize + 'rem');
			document.querySelectorAll('.wbw span div:first-child').forEach(el => el.style.fontSize = wbwArabicFontSize + 'rem');

		function loadSurah(number, verseToScroll = null) {
			if (currentViewMode !== 'surah') {
				// If in juzz mode but trying to load a surah, switch back to surah mode
				currentViewMode = 'surah';
				document.querySelector('.toggle-view').textContent = '📖';
				loadSurahList();
			}
			bismillahText.style.display = (parseInt(number) === 9) ? "none" : "block";
			showLoading();
			repeatProgress = {}; // reset progress whenever surah loads
			setTimeout(() => {
				const ayat = Object.keys(quranData)
					.filter(k => parseInt(k.split(':')[0]) === parseInt(number))
					.sort((a, b) => parseInt(a.split(':')[1]) - parseInt(b.split(':')[1]));
				if (!ayat.length) { surahContent.innerHTML = "<p>Not found.</p>"; return; }
				const meta = surahmeta.Surahs.find(s => s.number === parseInt(number));
				verseSelect.innerHTML = '<option value="">Select Verse</option>';
				ayat.forEach(k => {
					const ayahNum = k.split(':')[1];
					const opt = document.createElement('option');
					opt.value = ayahNum; opt.textContent = `Verse ${ayahNum}`;
					verseSelect.appendChild(opt);
				});
				// Save state for pagination
				currentSurah = number;
				surahSelect.value = number;
				currentAyatList = ayat;
				// Calculate correct page if a specific verse was requested
				if (verseToScroll) {
					// Find the index of the requested verse in the ayat list
					const requestedVerseIndex = ayat.findIndex(k => parseInt(k.split(':')[1]) === parseInt(verseToScroll));
					if (requestedVerseIndex !== -1) {
						// Calculate which page this verse is on (pages are 1-based)
						currentPage = Math.ceil((requestedVerseIndex + 1) / ayatPerPage);
					} else {
						currentPage = 1;
					}
				} else {
					currentPage = 1;
				}
				renderPage(meta, verseToScroll);
				localStorage.setItem('lastRead', JSON.stringify({ surah: number, verse: verseToScroll || 1 }));
			}, 350);
		}
		function loadJuzz(juzzIndex) {
			playedIntroForSurahs = {}; // Reset tracking when loading a new juzz
			if (currentViewMode !== 'juzz') {
				// If in surah mode but trying to load a juzz, switch to juzz mode
				currentViewMode = 'juzz';
				document.querySelector('.toggle-view').textContent = '📚';
				loadJuzzList();
			}
			const juzz = juzzmeta.find(j => j.index === juzzIndex);
			if (!juzz) return;
			currentJuzz = juzzIndex;
			surahSelect.value = juzzIndex;
			showLoading();
			// Get all verses in this juzz range
			const ayat = [];
			const startSurah = parseInt(juzz.start.surah);
			const endSurah = parseInt(juzz.end.surah);
			for (let s = startSurah; s <= endSurah; s++) {
				const surahAyat = Object.keys(quranData)
					.filter(k => parseInt(k.split(':')[0]) === s)
					.sort((a, b) => parseInt(a.split(':')[1]) - parseInt(b.split(':')[1]));
				if (s === startSurah) {
					// For start surah, only include verses from start.verse onwards
					const startVerse = parseInt(juzz.start.verse);
					const filtered = surahAyat.filter(k => {
						const verseNum = parseInt(k.split(':')[1]);
						return verseNum >= startVerse;
					});
					ayat.push(...filtered);
				} else if (s === endSurah) {
					// For end surah, only include verses up to end.verse
					const endVerse = parseInt(juzz.end.verse);
					const filtered = surahAyat.filter(k => {
						const verseNum = parseInt(k.split(':')[1]);
						return verseNum <= endVerse;
					});
					ayat.push(...filtered);
				} else {
					// For middle surahs, include all verses
					ayat.push(...surahAyat);
				}
			}
			if (!ayat.length) {
				surahContent.innerHTML = "<p>No verses found for this Juzz.</p>";
				return;
			}
			// Populate verse dropdown with formatted options
			verseSelect.innerHTML = '<option value="">Select Verse</option>';
			ayat.forEach(k => {
				const ayahNum = k.split(':')[1];
				const surahNum = k.split(':')[0];
				const opt = document.createElement('option');
				opt.value = `${surahNum}:${ayahNum}`;
				opt.textContent = `Surah ${surahNum}:${ayahNum}`;
				verseSelect.appendChild(opt);
			});
			// Save state for pagination
			currentPage = 1;
			currentAyatList = ayat;
			renderJuzzPage(juzz, ayat);
			localStorage.setItem('lastReadJuzz', JSON.stringify({
				juzz: juzzIndex,
				verse: ayat[0].split(':')[1],
				surah: ayat[0].split(':')[0]
			}));
		}

		// === NEW: Share Verse Function ===
		function shareVerse(surah, ayah) {
			const verseEl = document.getElementById(`verse-${surah}-${ayah}`) || document.getElementById(`verse-${ayah}`);
			if (!verseEl) return;
			let arabic = verseEl.querySelector(".arabic-text")?.innerText || "";
			// Remove/replace ayah end sign ( and similar)
			arabic = arabic.replace(/[\uFD00-\uFDFF\u06DD\u06DE]/g, "");
			arabic = arabic.slice(0, -1);
			// (optional) add a clean marker at end
			arabic = arabic.trim() + "سطس";
			const urdu = verseEl.querySelector(".translation")?.innerText || "";
			const hashiyah = verseEl.querySelector(".hashiyah")?.innerText || "";
			// 🔹 NEW: Word-by-word
			let wbwText = "";
			const wbwDataForVerse = wbwData?.[surah]?.[ayah];
			if (wbwDataForVerse) {
				wbwText = "\n📖 WBW:\n" + wbwDataForVerse.map(w => `${w.arabic} = ${w.urdu}`).join("\n");
			}
			let shareText = `📖 Surah ${surah}, Ayah ${ayah}\n\n`;
			if (arabic) shareText += `🔹 Arabic:\n${arabic}\n\n`;
			if (urdu) shareText += `🔸 Tarjumah:\n${urdu}\n\n`;
			if (wbwText) shareText += wbwText + "\n\n";
			if (hashiyah) shareText += `💡 Hashiyah:\n${hashiyah}\n\n`;
			// 🔗 Add sharable verse link
			const link = `${window.location.origin}${window.location.pathname}?${currentViewMode === 'juzz' ? 'juzz' : 'surah'}=${currentViewMode === 'juzz' ? currentJuzz : surah}&ayah=${ayah}`;
			if (navigator.share) {
				// Detect Chrome on Android
				const ua = navigator.userAgent.toLowerCase();
				const isAndroidChrome = ua.includes("android") && ua.includes("chrome");
				if (!isAndroidChrome) {
					// Only attach url for non-Chrome-mobile browsers
					shareText += `🔗 ${link}`;
				}
				navigator.share({
					title: `Surah ${surah}, Ayah ${ayah}`,
					text: shareText,
					url: link // also pass link as separate param
				}).catch(err => console.log("Share cancelled", err));
			} else {
				shareText += `🔗 ${link}`;
				navigator.clipboard.writeText(shareText).then(() => {
					alert("Verse copied to clipboard ✅");
				}).catch(() => {
					alert("Could not copy verse.");
				});
			}
		}
		// === UPDATED: handle play ===
		function handleAudioPlay(audioEl, type, surahNum = null) {
			if (currentPlayingAudio && currentPlayingAudio !== audioEl) {
				currentPlayingAudio.pause();
				currentPlayingAudio.currentTime = 0;
			}
			// Check if we need to play the intro verse
			if (type === "arabic") {
				let ayahNum;
				let currentSurahNum;
				if (currentViewMode === 'juzz') {
					// Parse the ID which is in format "audio-ar-{surahNum}-{ayahNum}"
					const idParts = audioEl.id.split('-');
					currentSurahNum = parseInt(idParts[2]);
					ayahNum = parseInt(idParts[3]);
				} else {
					currentSurahNum = parseInt(currentSurah);
					ayahNum = parseInt(audioEl.id.split('-')[2]);
				}

				// Check if this is the first verse of a surah (and not Surah 1 or 9)
				if (ayahNum === 1 && currentSurahNum !== 1 && currentSurahNum !== 9) {
					// Check if we've already played the intro for this surah in this session
					if (!playedIntroForSurahs[currentSurahNum]) {
						const introEl = document.getElementById("intro-audio");
						if (introEl) {
							audioEl.pause();
							audioEl.currentTime = 0;
							introEl.onended = () => {
								// Mark this surah as having had its intro played
								playedIntroForSurahs[currentSurahNum] = true;
								audioEl.play();
							};
							introEl.play();
							return; // stop here until intro finishes
						}
					}
				}
			}

			currentPlayingAudio = audioEl;
			playbackMode = type;
			// ✅ NEW call for background support
			if ("mediaSession" in navigator) {
				let ayahNum;
				if (currentViewMode === 'juzz') {
					// Extract ayah number from ID like "audio-ar-1-2"
					const idParts = audioEl.id.split('-');
					ayahNum = idParts[idParts.length - 1];
				} else {
					ayahNum = audioEl.id.split('-')[2];
				}
				const meta = currentViewMode === 'surah'
					? surahmeta.Surahs.find(s => s.number === parseInt(currentSurah))
					: { name: `Juzz ${currentJuzz}`, number: currentJuzz };
				setMediaSession(audioEl, type, ayahNum, meta);
			}
		}

		// === UPDATED: sequence logic with repeat + pagination + surah modes ===
		function playNext(type, currentAyahNum, currentSurahNum = null) {
			if (currentViewMode === 'juzz') {
				// Juzz view handling
				let currentKey;
				if (currentSurahNum) {
					currentKey = `${currentSurahNum}:${currentAyahNum}`;
				} else {
					// Fallback for when surahNum isn't provided (shouldn't happen in juzz view)
					currentKey = `${currentSurah}:${currentAyahNum}`;
				}
				const currentIndex = currentAyatList.findIndex(k => k === currentKey);
				if (currentIndex === -1) return;
				// Get or initialize repeat tracking for this verse
				if (!repeatProgress[currentKey]) repeatProgress[currentKey] = 1;
				let currentRepeat = repeatProgress[currentKey];
				let nextAudio = null;
				if (type === "arabic") {
					nextAudio = document.getElementById(`audio-ur-${currentSurahNum}-${currentAyahNum}`);
				} else if (type === "urdu") {
					if (currentRepeat < repeatCount) {
						// Increment repeat count and play arabic again
						repeatProgress[currentKey]++;
						nextAudio = document.getElementById(`audio-ar-${currentSurahNum}-${currentAyahNum}`);
					} else {
						// Reset repeat counter and move to next verse
						repeatProgress[currentKey] = 1;
						const nextAyahIndex = currentIndex + 1;
						if (nextAyahIndex < currentAyatList.length) {
							const nextKey = currentAyatList[nextAyahIndex];
							const [nextSurahNum, nextAyahNum] = nextKey.split(':');
							nextAudio = document.getElementById(`audio-ar-${nextSurahNum}-${nextAyahNum}`);
							// Check if we need to load next page
							if (nextAyahIndex >= currentPage * ayatPerPage) {
								currentPage++;
								const juzz = juzzmeta.find(j => j.index === currentJuzz);
								renderJuzzPage(juzz, currentAyatList);
								setTimeout(() => {
									nextAudio = document.getElementById(`audio-ar-${nextSurahNum}-${nextAyahNum}`);
									if (nextAudio) nextAudio.play();
								}, 500);
								return;
							}
						} else {
							// End of juzz - handle based on mode
							if (currentSurahMode === 0) {
								// Repeat same juzz
								loadJuzz(currentJuzz);
								setTimeout(() => {
									const firstAudio = document.getElementById(`audio-ar-${currentAyatList[0].split(':')[0]}-${currentAyatList[0].split(':')[1]}`);
									if (firstAudio) firstAudio.play();
								}, 600);
								return;
							} else if (currentSurahMode === 1) {
								// Continue to next juzz
								const nextJuzzIndex = parseInt(currentJuzz) + 1;
								if (nextJuzzIndex <= 30) {
									loadJuzz(String(nextJuzzIndex).padStart(2, '0'));
									setTimeout(() => {
										const firstAudio = document.getElementById(`audio-ar-${currentAyatList[0].split(':')[0]}-${currentAyatList[0].split(':')[1]}`);
										if (firstAudio) firstAudio.play();
									}, 600);
									return;
								}
							}
							// Default: stop at end of juzz
							return;
						}
					}
				}
				if (nextAudio) {
					nextAudio.play();
					scrollWithOffset(nextAudio.closest('.verse'), 120);
				}
			} else {
				// Original surah view logic
				if (!repeatProgress[currentSurah]) repeatProgress[currentSurah] = {};
				if (!repeatProgress[currentSurah][currentAyahNum]) repeatProgress[currentSurah][currentAyahNum] = 1;
				let currentRepeat = repeatProgress[currentSurah][currentAyahNum];
				let nextAudio = null;
				if (type === "arabic") {
					nextAudio = document.getElementById(`audio-ur-${currentAyahNum}`);
				} else if (type === "urdu") {
					if (currentRepeat < repeatCount) {
						repeatProgress[currentSurah][currentAyahNum]++;
						nextAudio = document.getElementById(`audio-ar-${currentAyahNum}`);
					} else {
						repeatProgress[currentSurah][currentAyahNum] = 1;
						const nextAyahNum = currentAyahNum + 1;
						nextAudio = document.getElementById(`audio-ar-${nextAyahNum}`);
						if (!nextAudio) {
							const ayahIndex = currentAyatList.findIndex(k => parseInt(k.split(':')[1]) === parseInt(currentAyahNum));
							if (ayahIndex >= 0 && ayahIndex + 1 < currentAyatList.length) {
								const nextAyahKey = currentAyatList[ayahIndex + 1];
								const nextNum = parseInt(nextAyahKey.split(':')[1]);
								const meta = surahmeta.Surahs.find(s => s.number === parseInt(currentSurah));
								currentPage = Math.ceil((ayahIndex + 2) / ayatPerPage);
								renderPage(meta, nextNum);
								setTimeout(() => {
									const el = document.getElementById(`audio-ar-${nextNum}`);
									if (el) el.play();
								}, 500);
								return;
							} else {
								if (currentSurahMode === 0) {
									loadSurah(currentSurah, 1);
									setTimeout(() => {
										const firstAudio = document.getElementById("audio-ar-1");
										if (firstAudio) firstAudio.play();
									}, 600);
									return;
								} else if (currentSurahMode === 1) {
									const nextSurah = parseInt(currentSurah) + 1;
									const metaNext = surahmeta.Surahs.find(s => s.number === nextSurah);
									if (metaNext) {
										loadSurah(nextSurah, 1);
										setTimeout(() => {
											const firstAudio = document.getElementById("audio-ar-1");
											if (firstAudio) firstAudio.play();
										}, 600);
										return;
									}
								}
								return;
							}
						}
					}
				}
				if (nextAudio) {
					nextAudio.play();
					scrollWithOffset(nextAudio.closest('.verse'), 120);
				}
			}
		}
		// === INTERNET HANDLING + AUDIO RESUME/RETRY ===
		function saveAudioState(audioEl, forceTime = false) {
			if (!audioEl) return;
			let ayahNum, surahNum;
			if (currentViewMode === 'juzz') {
				// Parse ID like "audio-ar-1-2"
				const idParts = audioEl.id.split('-');
				surahNum = idParts[2];
				ayahNum = idParts[3];
			} else {
				surahNum = currentSurah;
				ayahNum = audioEl.id.split('-')[2];
			}
			localStorage.setItem("lastAudioState", JSON.stringify({
				surah: surahNum,
				ayah: ayahNum,
				type: audioEl.id.includes("ar") ? "arabic" : "urdu",
				time: forceTime ? 0 : audioEl.currentTime,
				viewMode: currentViewMode,
				...(currentViewMode === 'juzz' && { juzz: currentJuzz })
			}));
		}
		// Pause & save on offline
		window.addEventListener("offline", () => {
			if (currentPlayingAudio && !currentPlayingAudio.paused) {
				saveAudioState(currentPlayingAudio);
				currentPlayingAudio.pause();
			}
		});
		// Retry on online
		window.addEventListener("online", () => {
			const state = localStorage.getItem("lastAudioState");
			if (state) {
				const { surah, ayah, type, time, viewMode, juzz } = JSON.parse(state);
				if (viewMode === currentViewMode) {
					const audioId = `audio-${type === "arabic" ? "ar" : "ur"}-${viewMode === 'juzz' ? `${surah}-` : ''}${ayah}`;
					const audioEl = document.getElementById(audioId);
					if (audioEl) {
						// Reload source to avoid disabled state
						audioEl.load();
						audioEl.currentTime = time || 0;
						audioEl.play().catch(() => { });
					} else if (viewMode === 'juzz' && juzz) {
						// If audio element not found, maybe we're not on the right juzz page
						loadJuzz(juzz);
						setTimeout(() => {
							const newAudioEl = document.getElementById(audioId);
							if (newAudioEl) {
								newAudioEl.currentTime = time || 0;
								newAudioEl.play().catch(() => { });
							}
						}, 1000);
					}
				}
				localStorage.removeItem("lastAudioState");
			}
		});
		// Save if audio fails to load
		document.addEventListener("error", e => {
			if (e.target.tagName === "AUDIO") {
				saveAudioState(e.target, true); // start again after restore
			}
		}, true);
		// Clear on full refresh
		window.addEventListener("beforeunload", () => {
			localStorage.removeItem("lastAudioState");
		});
		// Handle verse selection from dropdown
		verseSelect.addEventListener('change', () => {
			if (verseSelect.value) {
				if (currentViewMode === 'surah') {
					if (surahSelect.value) {
						loadSurah(surahSelect.value, verseSelect.value);
					}
				} else {
					// For juzz view, the verseSelect.value is in format "surah:ayah"
					const [surahNum, ayahNum] = verseSelect.value.split(':');
					// Find which juzz contains this verse
					const juzz = juzzmeta.find(j => {
						const startSurah = parseInt(j.start.surah);
						const endSurah = parseInt(j.end.surah);
						const currentSurah = parseInt(surahNum);
						if (currentSurah < startSurah || currentSurah > endSurah) return false;
						if (currentSurah === startSurah && currentSurah === endSurah) {
							return parseInt(ayahNum) >= parseInt(j.start.verse) &&
								parseInt(ayahNum) <= parseInt(j.end.verse);
						} else if (currentSurah === startSurah) {
							return parseInt(ayahNum) >= parseInt(j.start.verse);
						} else if (currentSurah === endSurah) {
							return parseInt(ayahNum) <= parseInt(j.end.verse);
						} else {
							return true; // middle surahs are fully included
						}
					});
					if (juzz) {
						currentJuzz = juzz.index;
						// Get all ayat for this juzz
						const ayat = [];
						const startSurah = parseInt(juzz.start.surah);
						const endSurah = parseInt(juzz.end.surah);
						for (let s = startSurah; s <= endSurah; s++) {
							const surahAyat = Object.keys(quranData)
								.filter(k => parseInt(k.split(':')[0]) === s)
								.sort((a, b) => parseInt(a.split(':')[1]) - parseInt(b.split(':')[1]));
							if (s === startSurah) {
								const startVerse = parseInt(juzz.start.verse);
								const filtered = surahAyat.filter(k => {
									const verseNum = parseInt(k.split(':')[1]);
									return verseNum >= startVerse;
								});
								ayat.push(...filtered);
							} else if (s === endSurah) {
								const endVerse = parseInt(juzz.end.verse);
								const filtered = surahAyat.filter(k => {
									const verseNum = parseInt(k.split(':')[1]);
									return verseNum <= endVerse;
								});
								ayat.push(...filtered);
							} else {
								ayat.push(...surahAyat);
							}
						}
						// Find the index of our target verse
						const targetKey = `${surahNum}:${ayahNum}`;
						const targetIndex = ayat.findIndex(k => k === targetKey);
						if (targetIndex !== -1) {
							// Calculate page containing this verse
							currentPage = Math.ceil((targetIndex + 1) / ayatPerPage);
							currentAyatList = ayat;
							renderJuzzPage(juzz, ayat);
							// Scroll to the selected verse
							setTimeout(() => {
								const el = document.getElementById(`verse-${surahNum}-${ayahNum}`);
								if (el) scrollWithOffset(el, 200);
							}, 500);
						}
					}
				}
			}
		});
		function updateSurahButton() {
			repeatSurahBtn.innerHTML = surahModes[currentSurahMode].html;
		}
		repeatSurahBtn.addEventListener("click", () => {
			currentSurahMode = (currentSurahMode + 1) % surahModes.length;
			updateSurahButton();
		});
		updateSurahButton();
		// === NEW: Enable background playback via Media Session API ===
		if ("mediaSession" in navigator) {
			function setMediaSession(audioEl, type, ayahNum, meta) {
				navigator.mediaSession.metadata = new MediaMetadata({
					title: currentViewMode === 'juzz'
						? `Juzz ${currentJuzz} - سورة ${meta?.name || ''} - آیت ${ayahNum}`
						: `سورة ${meta?.name || ''} - آیت ${ayahNum}`,
					artist: type === "arabic" ? "Quran Recitation" : "Urdu Translation",
					album: "Quran Majeed",
					artwork: [
						{ src: window.location.origin + "/QuranReader/src/favicon.png", sizes: "96x96", type: "image/png" },
						{ src: window.location.origin + "/QuranReader/src/favicon.png", sizes: "192x192", type: "image/png" },
						{ src: window.location.origin + "/QuranReader/src/favicon.png", sizes: "512x512", type: "image/png" }
					]
				});
				// Hook play/pause/next actions
				navigator.mediaSession.setActionHandler("play", () => { audioEl.play(); });
				navigator.mediaSession.setActionHandler("pause", () => { audioEl.pause(); });
				navigator.mediaSession.setActionHandler("stop", () => { audioEl.pause(); audioEl.currentTime = 0; });
				navigator.mediaSession.setActionHandler("nexttrack", () => {
					if (currentViewMode === 'juzz') {
						playNext(type, ayahNum, meta?.number || currentSurah);
					} else {
						playNext(type, ayahNum);
					}
				});
			}
		}
		// Initialize the app
		document.addEventListener("DOMContentLoaded", () => {
			// Load required scripts (assuming they're already included in the HTML)
			// loadSurahList();
			// Check URL parameters for direct navigation
			const params = new URLSearchParams(window.location.search);
			const qsSurah = params.get("surah");
			const qsAyah = params.get("ayah");
			const qsJuzz = params.get("juzz");
			if (qsJuzz) {
				currentViewMode = 'juzz';
				document.querySelector('.toggle-view').textContent = '📚';
				loadJuzzList();
				loadJuzz(qsJuzz);
				if (qsAyah) {
					// After loading the juzz, we'll select the ayah from the dropdown
					setTimeout(() => {
						const verseSelect = document.getElementById('verseSelect');
						for (let i = 0; i < verseSelect.options.length; i++) {
							const option = verseSelect.options[i];
							if (option.value.endsWith(`:${qsAyah}`) ||
								option.value === qsAyah) {
								verseSelect.value = option.value;
								verseSelect.dispatchEvent(new Event('change'));
								break;
							}
						}
					}, 1000);
				}
			} else if (qsSurah && qsAyah) {
				// Default to surah view if surah parameter is present
				currentViewMode = 'surah';
				document.querySelector('.toggle-view').textContent = '📖';
				loadSurahList();
				loadSurah(qsSurah, qsAyah);
			} else {
				// Default to surah view if no parameters
				currentViewMode = 'surah';
				document.querySelector('.toggle-view').textContent = '📖';
				loadSurahList();
				// Try to restore last read position
				const lastRead = JSON.parse(localStorage.getItem("lastRead"));
				if (lastRead) {
					loadSurah(lastRead.surah, lastRead.verse);
				}
			}
			// Hide loading screen after initialization
			window.addEventListener("load", () => {
				const loader = document.getElementById("loading-screen");
				loader.style.opacity = "0";
				setTimeout(() => loader.style.display = "none", 500);
			});
		});
		// === Surah search filter ===
		document.addEventListener("DOMContentLoaded", () => {
			const surahSearch = document.getElementById("surahSearch");
			const surahSelect = document.getElementById("surahSelect");

			if (surahSearch && surahSelect) {
				surahSearch.addEventListener("keyup", function () {
					const filter = this.value.toLowerCase();
					Array.from(surahSelect.options).forEach(option => {
						if (!option.value) return; // skip "Select Surah"
						const text = option.textContent.toLowerCase();
						option.style.display = text.includes(filter) ? "" : "none";
					});
				});
			}
		});

		(function () {
			const searchBox = document.getElementById("surahSearch");
			const dropdownList = document.getElementById("dropdownList");
			const hiddenSelect = document.getElementById("surahSelect");

			function showList(filter = "") {
				dropdownList.innerHTML = "";
				const options = Array.from(hiddenSelect.options).filter(opt => opt.value);
				options
					.filter(opt => opt.textContent.toLowerCase().includes(filter.toLowerCase()))
					.forEach(opt => {
						const div = document.createElement("div");
						div.textContent = opt.textContent;
						div.style.padding = "8px";
						div.style.cursor = "pointer";
						div.onclick = () => {
							// Update search box
							searchBox.value = opt.textContent;
							// Update hidden select so existing logic works
							hiddenSelect.value = opt.value;
							hiddenSelect.dispatchEvent(new Event("change", { bubbles: true }));
							dropdownList.style.display = "none";
						};
						dropdownList.appendChild(div);
					});
				dropdownList.style.display = "block";
			}

			searchBox.addEventListener("focus", () => showList());
			searchBox.addEventListener("input", e => showList(e.target.value));
			document.addEventListener("click", e => {
				if (!e.target.closest(".dropdown")) {
					dropdownList.style.display = "none";
				}
			});
		})();

	</script>
